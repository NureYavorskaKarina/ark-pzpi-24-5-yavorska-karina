# .rubocop.yml
AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
Layout/LineLength:
  Max: 120

# lefthook.yml
pre-commit:
  commands:
    rubocop:
      run: bundle exec rubocop {staged_files}

# .github/workflows/ci.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec rspec
